<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">

    <title>Login - Fast Food Store</title>
    
</head>

<body class="login-page">
    <!-- Header -->
    <header>
        <h1>Login Page</h1>
        <nav>
            <a href="login.html">Login 🔑</a>
            <a href="signup.html">Sign Up ✍</a>
            <a href="home.html">Home 🏠</a>
            <a href="about.html">About Us 🛒</a>
            <a href="menuFood.html">Food Menu 📋</a>
            <a href="menuDrinks.html">Drinks Menu 📋</a>
            <a href="dailyDealsContact.html">DailyDeals,Contact ✨📞</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        <section>
            <h2 style="text-align: center;">Login to Your Account</h2>
            <form>
                <label for="username">Username</label><br>
                <input type="text" id="username" name="username" placeholder="Enter your name"><br><br>

                <label for="password">Password</label><br>
                <input type="password" id="password" name="password" placeholder="Enter a strong password"><br><br>

                <button>Login</button>
            </form>
            <br>
            <!-- Aside لمحتوى جانبي مثل نصائح أو روابط إضافية -->
            <aside>
                <p>Forgot your password? <a href="reset.html">Reset here</a></p>
                <p>New user? <a href="signup.html">Sign up</a></p>
            </aside>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>© 2025 Fast Food Store. All Rights Reserved.</p>
    </footer>
    <script src="../JAVA/script.js"></script>
</body>

</html>
